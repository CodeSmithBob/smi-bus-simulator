name: Release

# Push a tag like v0.3.0 to publish a release. The tag must match the version in
# pyproject.toml and src/smisim/__init__.py, and CHANGELOG.md needs a
# "## 0.3.0 (YYYY-MM-DD)" section; its text becomes the release notes.
#
# 1. build:          check tag/version/changelog, lint, test, build sdist and wheel
# 2. pypi:           upload to PyPI with Trusted Publishing (no token stored anywhere;
#                    PyPI trusts this repository, this workflow and the "pypi" environment)
# 3. github-release: create the GitHub release with the same files and the notes
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" build twine
      - name: Check tag, version and changelog
        run: python scripts/release_check.py "$GITHUB_REF_NAME" --notes release-notes.md
      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          pytest -q
      - name: Build sdist and wheel
        run: |
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/smi-bus-simulator/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "smi-bus-simulator ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            $prerelease
